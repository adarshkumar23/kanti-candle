<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5E1A"/>
      <stop offset="30%" stop-color="#C6963F"/>
      <stop offset="60%" stop-color="#F3BE63"/>
      <stop offset="80%" stop-color="#C6963F"/>
      <stop offset="100%" stop-color="#9A7028"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3BE63"/>
      <stop offset="50%" stop-color="#C6963F"/>
      <stop offset="100%" stop-color="#8B5E1A"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="160" cy="160" r="152" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>

  <!-- Candle body -->
  <rect x="151" y="98" width="18" height="68" rx="5" stroke="url(#goldGrad)" stroke-width="1.8" fill="none"/>

  <!-- Wick -->
  <line x1="160" y1="90" x2="160" y2="98" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Flame -->
  <path d="M160 75 C155 81 153 86 155 91 C157 96 163 96 165 91 C167 86 165 81 160 75Z"
        stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>

  <!-- K left vertical arm — implied by candle body, so just add the diagonals -->
  <!-- Upper diagonal of K: from candle midpoint up-right -->
  <path d="M169 116 C182 104 196 98 208 96"
        stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Lower diagonal of K: from candle midpoint down-right, with script flourish -->
  <path d="M169 134 C182 148 196 158 212 166 C222 172 226 176 220 185 C214 193 200 191 188 184"
        stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Script tail / decorative flourish curling left -->
  <path d="M188 184 C174 178 162 170 155 162 C148 154 148 146 151 134"
        stroke="url(#goldGrad)" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Text: KANTI -->
  <text x="160" y="228"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="30"
        font-weight="500"
        letter-spacing="10"
        text-anchor="middle"
        fill="url(#goldGrad)">KANTI</text>

  <!-- Text: CANDLES -->
  <text x="160" y="254"
        font-family="DM Sans, Arial, sans-serif"
        font-size="13"
        font-weight="400"
        letter-spacing="7"
        text-anchor="middle"
        fill="url(#goldGrad2)">CANDLES</text>
</svg>
